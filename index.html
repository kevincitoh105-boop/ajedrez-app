<style>
:root{--bg:#16232a;--ink:#f1ead7;--lt:#e3d3ab;--dk:#587a6c;--ac:#f2b441;--mut:#9fb3ad;--pn:#22343c;--bd:min(100vw - 20px,480px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,serif;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
main{width:var(--bd)}
nav{display:flex;gap:6px;margin-bottom:8px}
button,select{font:inherit;color:var(--ink);background:var(--pn);border:1px solid #3c545d;border-radius:8px;padding:9px 12px}
button:disabled{opacity:.4}
button.on,button.go{background:var(--ac);color:#1b1b1b;border-color:var(--ac)}
nav button{flex:1}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:var(--bd);height:var(--bd);border:2px solid #0d161a;border-radius:4px;overflow:hidden;user-select:none;touch-action:manipulation}
.sq{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;font:calc(var(--bd)/8*.78)/1 'Noto Sans Symbols 2','Segoe UI Symbol',serif;position:relative}
.l{background:var(--lt)}.d{background:var(--dk)}
.w{color:#fff;text-shadow:0 0 3px #000,0 0 1px #000}.b{color:#101010}
.sel{box-shadow:inset 0 0 0 4px var(--ac)}
.hint{box-shadow:inset 0 0 0 4px #4ea3ff}
.last{background-image:linear-gradient(rgba(242,180,65,.45),rgba(242,180,65,.45))}
.chk{background-image:radial-gradient(circle,rgba(229,72,77,.95) 0,rgba(229,72,77,.15) 75%)}
.tg::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(20,30,30,.45);position:absolute}
.tg.hp::after{width:86%;height:86%;background:none;border:4px solid rgba(20,30,30,.45)}
#st{margin:6px 0;min-height:3em}
#mv{min-height:2.6em;font-size:14px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
input[type=range]{flex:1;accent-color:var(--ac)}
small,#plan{color:var(--mut)}
#pr button{font-size:30px;flex:1;padding:4px}
.lesson{background:var(--pn);border:1px solid #3c545d;border-radius:10px;padding:12px;margin:8px 0}
.lesson h3{margin:0 0 8px;color:var(--ac);font-size:18px}.lesson p{margin:7px 0}
.lesson b{color:#f2b441}.lesson .tag{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
#altplay,#backline{flex:1}
[hidden]{display:none!important}

import {Chess} from './lib/chess.js';
const $=s=>document.querySelector(s),GL={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'},V={p:100,n:320,b:330,r:500,q:900,k:0};
const L=[
["Clase 1 · Principios de apertura","1.e4 e5 2.Nf3 Nc6 3.Bb5 a6 4.Ba4 Nf6 5.O-O Be7","Aprende a ocupar el centro, desarrollar piezas menores y enrocar.","1.e4 controla d5 y libera piezas. Nf3 desarrolla atacando e5. Bb5 presiona al defensor. El enroque pone el rey a salvo y conecta las torres.","No saques la dama demasiado pronto ni muevas una pieza varias veces sin una razón táctica.","Aperturas · Principiante"],
["Clase 2 · Sistema Londres: estructura","1.d4 d5 2.Bf4 Nf6 3.e3 e6 4.Nf3 Bd6 5.Bg3 O-O 6.Nbd2 c5 7.c3 Nc6 8.Bd3","Construye la estructura d4-e3-c3 y prepara e4 o un ataque de rey.","Bf4 desarrolla el alfil antes de cerrar la cadena con e3. Nf3 y Nbd2 desarrollan; c3 sostiene d4; Bd3 apunta al enroque.","No juegues e4 automáticamente si dejas d4 débil o permites ...cxd4 con ganancia de tiempo.","Aperturas · Londres"],
["Clase 3 · Londres contra ...c5 y ...Qb6","1.d4 d5 2.Nf3 Nf6 3.Bf4 c5 4.e3 Nc6 5.c3 Qb6 6.Qb3 c4 7.Qxb6 axb6","Responde a la presión sobre b2 y aprende cuándo cambiar damas.","Qb3 ofrece el cambio de damas y reduce la presión sobre b2. Tras ...axb6, las negras aceptan peones doblados a cambio de actividad.","Una defensa pasiva de b2 puede retrasar tu desarrollo. Evalúa el final antes de cambiar damas.","Aperturas · Londres"],
["Clase 4 · Caro-Kann: idea central","1.e4 c6 2.d4 d5 3.Nc3 dxe4 4.Nxe4 Bf5 5.Ng3 Bg6 6.h4 h6 7.Nf3 Nd7","La Caro-Kann golpea el centro con ...d5 y desarrolla pronto el alfil de c8.","...c6 prepara ...d5 sin encerrar el alfil. Tras el cambio en e4, ...Bf5 desarrolla esa pieza antes de ...e6.","La solidez no debe convertirse en pasividad: prepara ...c5 o ...e5 para disputar el centro.","Aperturas · Caro-Kann"],
["Clase 5 · Caro-Kann Avance","1.e4 c6 2.d4 d5 3.e5 Bf5 4.Nf3 e6 5.Be2 c5 6.Be3 Nc6","Ataca la base del centro blanco antes de quedar restringido.","...Bf5 saca el alfil antes de cerrar la diagonal. ...c5 golpea d4 y obliga a las blancas a sostener su centro.","No te limites a desarrollar detrás de tus peones: si no atacas el centro, las blancas ganan espacio.","Aperturas · Caro-Kann"],
["Clase 6 · Caro-Kann Clásica","1.e4 c6 2.d4 d5 3.Nc3 dxe4 4.Nxe4 Bf5 5.Ng3 Bg6 6.h4 h6 7.Nf3 Nd7 8.h5 Bh7 9.Bd3 Bxd3 10.Qxd3 e6","Comprende el desarrollo negro y el plan de espacio blanco en el flanco de rey.","El alfil sale antes de ...e6 y luego se repliega. ...Nd7 y ...e6 completan el desarrollo y preparan ...Ngf6.","No ignores el espacio que gana el rival en el flanco de rey ni avances peones sin desarrollar piezas.","Aperturas · Caro-Kann"],
["Clase 7 · Medio juego: actividad y plan","1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 4.c3 Nf6 5.d4 exd4 6.cxd4 Bb4+ 7.Nc3","Convierte desarrollo y estructura en un plan concreto.","d4 abre líneas y gana espacio. Las piezas deben ocupar columnas y diagonales abiertas; responder al jaque con desarrollo mejora la coordinación.","Antes de atacar, comprueba si participan tus piezas. Una torre bloqueada por tus propios peones no ejerce presión.","Medio juego · Planes"],
["Clase 8 · Táctica: captura distraída y mate","1.e4 e5 2.Nf3 d6 3.Bc4 Bg4 4.Nc3 g6 5.Nxe5 Bxd1 6.Bxf7+ Ke7 7.Nd5#","Una trampa clásica enseña por qué no se debe capturar material sin revisar los jaques.","Las blancas aprovechan que las negras toman la dama sin comprobar la seguridad del rey. Bxf7+ y Nd5 coordinan un mate.","Antes de capturar, busca jaques, capturas y amenazas del rival. La dama no compensa recibir mate.","Medio juego · Táctica y trampas"],
["Clase 9 · Finales: actividad del rey","1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 4.d3 Nf6 5.O-O O-O 6.c3 d6 7.Re1 a6","En los finales el rey se convierte en una pieza activa.","En finales de peones, la oposición ayuda a impedir el avance del rey rival. Un peón pasado puede distraer al rey defensor.","No empujes un peón pasado sin calcular si el rey rival puede bloquearlo. Activa tu rey primero.","Finales · Fundamentos"],
["Clase 10 · Finales de torres","1.e4 e5 2.Nf3 Nc6 3.Bb5 a6 4.Ba4 Nf6 5.O-O Be7 6.Re1 b5 7.Bb3 d6","Aprende a priorizar actividad de torres, columnas abiertas y cortar al rey.","Una torre activa detrás de un peón pasado o en séptima fila crea amenazas. La defensa lateral puede ser más eficaz que bloquear delante.","No cambies tu torre activa por una pasiva sin razón concreta ni persigas peones dejando entrar al rey.","Finales · Torres"],
["Clase 11 · Trampas históricas: Legal","1.e4 e5 2.Nf3 d6 3.Bc4 Bg4 4.Nc3 g6 5.Nxe5 Bxd1 6.Bxf7+ Ke7 7.Nd5#","Una combinación clásica muestra que sacrificar la dama puede conducir a mate forzado.","El patrón combina desarrollo, rey rival en el centro y jaques coordinados. La secuencia final es mate, no una simple ganancia material.","Memoriza el patrón, no una receta: si el rival cambia el orden o defiende una casilla clave, la combinación puede no funcionar.","Partidas y trampas · Clásicos"],
["Clase 12 · Masterización: pensar como jugador completo","1.d4 d5 2.Bf4 Nf6 3.e3 e6 4.Nf3 Bd6 5.Bg3 O-O 6.Nbd2 c5 7.c3 Nc6 8.Bd3","Reto final: evalúa estructura, seguridad de reyes, pieza peor colocada, ruptura y plan para tres jugadas.","Un plan nace de evaluar material, seguridad de los reyes, actividad, estructura y amenazas. Elige una mejora concreta y comprueba la respuesta rival.","No existe una jugada automática que gane siempre. Dominar significa justificar decisiones y adaptarse a los cambios del rival.","Masterización · Evaluación completa"]
];

/* Repertorio ampliado: lecciones originales basadas en temas y líneas públicas
   identificadas en las listas del canal PupiloChess. No reproduce sus guiones. */
L.push(
["Repertorio · Defensa Ortodoxa: idea y estructura","1.d4 d5 2.c4 e6 3.Nc3 Nf6 4.Bg5 Be7 5.e3 O-O 6.Nf3 h6 7.Bh4 b6","Construye un repertorio sólido con negras contra el peón de dama y entiende por qué la estructura ortodoxa es flexible.","...e6 sostiene d5 y libera el alfil de f8. ...Nf6 desarrolla y disputa e4. ...Be7 completa el desarrollo sin debilitar el rey. ...h6 pregunta al alfil y ...b6 prepara ...Ab7 o ...Aa6 según la posición. La defensa no consiste en quedarse quieto: hay que preparar ...c5 o ...e5 cuando las piezas estén coordinadas.","No confundas solidez con pasividad. Si las negras no cuestionan el centro, las blancas pueden ganar espacio y preparar un ataque sin oposición. Antes de cambiar en c4 o d4, revisa qué estructura queda y qué pieza mejora con el cambio.","Aperturas · Defensa Ortodoxa"],
["Repertorio · Londres contra la Defensa Ortodoxa","1.d4 d5 2.Bf4 Nf6 3.e3 e6 4.Nd2 c5 5.c3 Nc6 6.Ngf3 Bd6 7.Bg3 Qc7 8.Bd3 O-O 9.O-O","Aprende a reconocer el esquema ...e6 y ...Bd6 y a decidir cuándo cambiar el alfil o mantener la tensión.","El desarrollo con Nd2 antes de Nf3 evita algunas molestias tácticas sobre b2 y mantiene opciones para el caballo. ...c5 ataca la base d4. Si ...Bd6 cambia el alfil de casillas claras, las blancas pueden aceptar el cambio y usar la columna o la casilla e5; si lo conservan, deben vigilar ...Nh5 y la presión central.","No juegues Bd3 por rutina si permite que ...cxd4 te deje un peón aislado difícil de defender. Calcula primero qué recaptura tendrás y si puedes sostener d4.","Aperturas · Sistema Londres"],
["Repertorio · Londres ante ...c5 y ...Db6","1.d4 d5 2.Bf4 Nf6 3.e3 e6 4.Nd2 c5 5.c3 Qb6 6.Qb3 c4 7.Qxb6 axb6","Resuelve la presión temprana sobre b2 sin perder el hilo del desarrollo.","...Db6 ataca b2 y obliga a las blancas a responder con precisión. Qb3 ofrece el cambio de damas: tras ...c4, Qxb6 elimina la dama atacante y ...axb6 deja una estructura distinta, con peones doblados en el flanco de dama. El cambio de damas puede reducir el peligro sobre el rey, pero también transforma los planes del medio juego.","No defiendas b2 automáticamente con una jugada que retrase el desarrollo. Compara Qb3, Na3 y otras respuestas según la posición exacta; una idea que funciona en una estructura puede fallar en otra.","Aperturas · Sistema Londres"],
["Repertorio · Londres: actividad antes que ataque","1.d4 d5 2.Bf4 Nf6 3.e3 e6 4.Nf3 Bd6 5.Bg3 O-O 6.Bd3 c5 7.c3 Nc6 8.Nbd2","Convierte el esquema de apertura en un plan de medio juego basado en piezas activas y rupturas centrales.","La prioridad es completar el desarrollo, enrocar y colocar las torres en columnas útiles. La ruptura ...c5 es el contragolpe temático contra d4. Las blancas deben decidir si mantienen la tensión, cambian en c5 o preparan e4. La casilla e5 puede convertirse en puesto avanzado si las piezas la sostienen.","No lances un ataque de peones en el flanco de rey mientras el centro pueda abrirse contra tu rey. Primero pregunta qué ruptura central puede jugar el rival y quién se beneficia de ella.","Medio juego · Planes y estructuras"],
["Repertorio · Caro-Kann: variante del cambio","1.e4 c6 2.d4 d5 3.exd5 cxd5 4.Bd3 Nc6 5.c3 Nf6 6.Bf4 Bg4 7.Qb3 Qd7 8.Nd2 e6 9.Ngf3 Bd6 10.Bxd6 Qxd6","Comprende los planes de ambos colores cuando desaparece la tensión inicial del centro.","Después de 3.exd5 cxd5 las negras recuperan con el peón c y obtienen una estructura simétrica en apariencia, pero las casillas y el desarrollo determinan los planes. Las blancas pueden buscar desarrollo rápido y presión sobre d5; las negras deben desarrollar sin bloquear sus piezas, completar el enroque y usar ...e6 o ...e5 según la preparación.","No supongas que una estructura simétrica significa tablas automáticas. Revisa qué bando desarrolla primero, qué pieza tiene menos actividad y si una ruptura puede crear un peón aislado o una columna abierta.","Aperturas · Caro-Kann"],
["Repertorio · Caro-Kann: ataque Panov","1.e4 c6 2.d4 d5 3.exd5 cxd5 4.c4 Nf6 5.Nc3 e6 6.Nf3 Bb4 7.cxd5 Nxd5 8.Bd2 O-O 9.Bd3 Nc6","Estudia la estructura de peón aislado y el precio que cada bando paga por la actividad.","Con 4.c4 las blancas buscan desarrollo rápido y presión central, aceptando que pueden aparecer peones aislados o colgantes. Las negras deben decidir cuándo cambiar en d5 y cómo bloquear la actividad blanca. El desarrollo importa más que ganar un peón: las piezas activas pueden compensar una debilidad estructural.","No captures material sin mirar si abres líneas para las piezas rivales. Si te toca defender el peón aislado, busca bloquearlo y cambiar piezas; si lo tienes, usa su movilidad para ganar espacio y actividad.","Aperturas · Caro-Kann"],
["Repertorio · Caro-Kann: variante del avance","1.e4 c6 2.d4 d5 3.e5 Bf5 4.Nf3 e6 5.Be2 c5 6.O-O Nc6 7.c3 Qb6 8.a3 cxd4 9.cxd4","Aprende a atacar la cadena de peones blanca en su base en vez de limitarte a esperar.","Tras 3.e5 las blancas ganan espacio, pero el peón d4 sostiene la cadena. ...Bf5 desarrolla el alfil antes de cerrar la diagonal con ...e6. La ruptura ...c5 cuestiona d4; ...Db6 añade presión sobre b2 y d4. Las blancas deben sostener el centro y evitar que las piezas negras ocupen casillas activas.","No juegues ...e6 antes de sacar el alfil de c8 si puedes desarrollarlo con seguridad. Tampoco avances peones del flanco sin calcular si el centro puede abrirse.","Aperturas · Caro-Kann"],
["Repertorio · Caro-Kann: sistema clásico","1.e4 c6 2.d4 d5 3.Nc3 dxe4 4.Nxe4 Bf5 5.Ng3 Bg6 6.h4 h6 7.Nf3 Nd7 8.h5 Bh7 9.Bd3 Bxd3 10.Qxd3 e6","Entiende la maniobra del alfil y cómo completar el desarrollo negro sin quedar encerrado.","La idea de ...Bf5 es desarrollar el alfil antes de ...e6. Cuando las blancas lo persiguen con h4-h5, el alfil puede retirarse a h7 si la diagonal está libre. ...Nd7 y ...e6 preparan el desarrollo restante y la conexión de torres. Las blancas ganan espacio en el flanco de rey, pero deben justificarlo con desarrollo y presión real.","No persigas al alfil con peones sin comprobar qué casillas debilitas alrededor de tu rey. Para las negras, no confundas una retirada con una pieza fuera de juego: busca una ruta de regreso y una ruptura central.","Aperturas · Caro-Kann"],
["Repertorio · Consejos prácticos: activar y atacar","1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 4.c3 Nf6 5.d4 exd4 6.cxd4 Bb4+ 7.Nc3","Practica el principio de mejorar tus piezas antes de iniciar una combinación.","Una jugada fuerte suele cumplir una función concreta: activar una pieza, atacar una debilidad o impedir el plan rival. El centro y la seguridad del rey condicionan cualquier ataque en el flanco. Cuando el rival amenaza, la defensa activa busca responder con una amenaza propia, no limitarse a retroceder.","No ataques con una sola pieza. Antes de iniciar una operación, cuenta cuántas piezas participan, identifica la defensa rival y calcula la respuesta más forzada: jaques, capturas y amenazas.","Medio juego · Consejos prácticos"],
["Repertorio · Estructuras: peón aislado y rupturas","1.d4 d5 2.c4 e6 3.Nc3 Nf6 4.Nf3 c5 5.cxd5 exd5 6.Bg5 Be6 7.e3 Bd6 8.Bd3","Reconoce cuándo una estructura de peones crea una debilidad y cuándo concede actividad a cambio.","Un peón aislado puede ser un objetivo estático, pero también controla casillas y ofrece líneas abiertas para las piezas. El bando que lo defiende busca bloquear delante y cambiar piezas; el bando que lo tiene intenta activar torres y piezas menores antes de que el rival lo bloquee.","No evalúes una estructura contando solo peones débiles. Pregunta qué casillas controla cada peón, qué columna se abre y qué bando tiene más actividad para aprovecharla.","Medio juego · Estructuras de peones"]
);

L.push(
["PupiloChess · Londres: origen y orden de jugadas","d4 d5 Nf3 Nf6 Bf4 e6 e3 Bd6 Bg3 O-O Nbd2 c5 c3","Conoce el origen histórico del Sistema Londres y por qué el orden de jugadas cambia la posición. Esta secuencia es una posición de práctica, no la partida histórica exacta.","En el vídeo introductorio, PupiloChess conecta el Londres con sus antecedentes históricos y muestra que el nombre de una apertura puede variar según el orden de jugadas. El caballo en f3 conserva flexibilidad: todavía puedes decidir si entrar en un Londres clásico o transponer a un gambito de dama. No juegues por el nombre de la apertura; identifica la estructura y el plan que realmente apareció.","No memorices una etiqueta como si garantizara una posición. Un pequeño cambio de orden puede permitir ...c5, ...Ad6 o ...Af5 en condiciones distintas.","PupiloChess · Londres · historia · Tn6cD5Wn8i8","Tn6cD5Wn8i8"],
["PupiloChess · Rubinstein: el control de e5","d4 d5 Nf3 Nf6 Bf4 e6 e3 Bd6 Bxd6 Qxd6 Nbd2 O-O Bd3 c5 c3 Nc6 O-O","Estudia una de las ideas centrales del Londres clásico a través de las partidas de Akiba Rubinstein. Línea de entrenamiento basada en el tema explicado.","PupiloChess destaca que no basta con desarrollar piezas: hay que disputar la casilla e5. Si las blancas cambian el alfil de d6, pueden construir un puesto avanzado para el caballo y preparar f4. El plan busca un caballo fuerte en e5 y una estructura que limite las piezas negras.","No cambies automáticamente el alfil de f4 por el de d6 sin evaluar si el caballo podrá ocupar e5. Si las negras controlan esa casilla, el plan blanco pierde gran parte de su fuerza.","PupiloChess · Londres · Rubinstein · wblQj5t1Wpk","wblQj5t1Wpk"],
["PupiloChess · Londres: superprotección y centro de piezas","d4 d5 Nf3 Nf6 Bf4 e6 e3 Bd6 Bxd6 Qxd6 Nbd2 O-O Bd3 c5 c3 Nc6 O-O Qc7 Qe2","Aprende por qué una casilla central puede valer más que una estructura de peones aparentemente perfecta.","La enseñanza de Rubinstein que PupiloChess subraya es la superprotección: varias piezas colaboran para sostener una casilla estratégica, especialmente e5. Los peones f4 y c3 pueden controlar casillas centrales sin ocuparlas. Un caballo instalado en e5 suele ser más fuerte que un peón que simplemente avance al centro.","No juzgues los peones doblados o aislados solo por su aspecto. Pregunta qué casillas controlan y si permiten instalar una pieza en un puesto avanzado.","PupiloChess · Londres · superprotección · wblQj5t1Wpk","wblQj5t1Wpk"],
["PupiloChess · Londres: celadas y cálculo concreto","d4 d5 Bf4 Nf6 e3 e6 Nd2 Bd6 Bg3 O-O Bd3 c5 c3 Nc6 Ngf3 Qc7 Qe2","Reconoce los motivos tácticos que aparecen cuando el negro se desarrolla sin atender a la seguridad del rey.","En el análisis de partidas de alta precisión, PupiloChess insiste en reconocer patrones y no confiarse por haber ganado un peón. Las ideas de Ce5, f4 y el ataque sobre h7 dependen de la posición exacta y de que las piezas blancas estén coordinadas. Antes de capturar, calcula jaques intermedios, clavadas y amenazas sobre la dama.","No ejecutes Axh7+ o un sacrificio en g5 solo porque recuerdes una celada. Si cambia una pieza defensora o una casilla está cubierta, la combinación puede dejar de funcionar. Los subtítulos no permiten certificar todas las variantes forzadas.","PupiloChess · Londres · celadas · 0Xxfnr4gIwM","0Xxfnr4gIwM"],
["PupiloChess · Londres contra la India de Rey","d4 Nf6 Bf4 g6 e3 Bg7 Nd2 O-O Ngf3 d6 Be2 Nbd7 O-O e5","Aprende a jugar contra esquemas de India de Rey sin lanzar un ataque automático contra el rey.","PupiloChess compara planes de ataque con el control del centro y el espacio. Contra ...g6 y ...Bg7, las negras suelen buscar ...e5 o ...c5 y contrajuego en el flanco de rey. Las blancas deben decidir por dónde tienen ventaja de espacio y, si atacan un flanco, procurar que el centro esté suficientemente controlado o cerrado.","No copies una avalancha de peones sin mirar el centro. Si se abren líneas centrales mientras tu rey está en el mismo flanco, tu propio ataque puede volverse contra ti.","PupiloChess · Londres · India de Rey · oo-_E-s3g_w","oo-_E-s3g_w"],
["PupiloChess · Londres como apertura de ataque","d4 d5 Bf4 Nf6 e3 e6 Nd2 Bd6 Bg3 O-O Bd3 c5 c3 Nc6 Ngf3 Qc7 Qe2","Construye el ataque con piezas coordinadas, no con avances de peones aislados.","El estilo que PupiloChess presenta para el Londres prioriza la actividad: caballo en e5 cuando la posición lo permite, apoyo con f4, dama y torres hacia el flanco de rey. Atacar significa abrir líneas, y para abrirlas hacen falta rupturas de peón o sacrificios calculados. El plan cambia según la defensa rival; no es una receta fija.","No confundas jugar agresivo con atacar antes de desarrollar. Si no participan varias piezas, el avance de peones puede dejar casillas débiles y tu rey expuesto.","PupiloChess · Londres · ataque · r37Hq_eXEGQ","r37Hq_eXEGQ"],
["PupiloChess · Caro-Kann: ataque Rubinstein con blancas","e4 c6 d4 d5 exd5 cxd5 Bd3 Nc6 c3 Nf6 Bf4 e6 Nd2 Bd6 Bxd6 Qxd6 Qe2","Estudia el plan de ataque que PupiloChess recomienda contra la Caro-Kann y su conexión con el Londres.","El vídeo presenta la variante del cambio con Ad3 y Af4, relacionada con el sistema Rubinstein. Si las negras dejan el alfil dentro de la cadena, las blancas pueden cambiarlo, llevar el caballo a e5 y apoyarlo con f4. Si las negras desarrollan el alfil fuera de la cadena, el plan debe ajustarse: Qb3 o Nf3 pueden ser alternativas según la posición.","No persigas el ataque si las negras han resuelto el problema del alfil y controlan e5. La ventaja blanca, cuando existe, puede ser pequeña y exige jugar bien el medio juego.","PupiloChess · Caro-Kann · Rubinstein · XilUjJwUrYc","XilUjJwUrYc"],
["PupiloChess · Caro-Kann: defensa frente a Qb3","e4 c6 d4 d5 exd5 cxd5 Bd3 Nc6 c3 Nf6 Bf4 Bg4 Qb3 Qd7","Aprende a defender la Caro-Kann sin aferrarte a un peón ni permitir que el rival gane tiempos.","En la variante Rubinstein, PupiloChess muestra que las negras deben desarrollar el alfil y responder con precisión a la presión sobre b7. La dama blanca en b3 plantea una cuestión concreta: defender el peón sin dejar que las piezas negras se descoordinen. La defensa debe buscar actividad y una posición jugable, no conservar cada peón a cualquier precio.","No captures un peón lateral sin calcular la respuesta y la seguridad de tu rey. Una jugada natural puede ser imprecisa si deja al rival instalar un caballo en e5 o abrir la columna h.","PupiloChess · Caro-Kann · Rubinstein · XilUjJwUrYc","XilUjJwUrYc"],
["PupiloChess · Ataque Panov: desarrollo y contrajuego","e4 c6 d4 d5 exd5 cxd5 c4 Nf6 Nc3 e6 Nf3 Bb4 Bd3 O-O O-O Nc6","Comprende la lucha dinámica del Panov y el equilibrio entre estructura y actividad.","En el Panov, las blancas aceptan una estructura que puede dejar un peón aislado a cambio de desarrollo y presión central. Las negras deben completar el desarrollo, coordinar las piezas y decidir cuándo bloquear el peón aislado o cambiar piezas. PupiloChess recalca que el nombre agresivo de la variante no significa que haya que atacar sin preparación.","No te obsesiones con ganar el peón aislado inmediatamente. Si las piezas blancas están activas, una captura puede abrir líneas y concederles iniciativa.","PupiloChess · Caro-Kann · Panov · R2sqcxVi2qE","R2sqcxVi2qE"],
["PupiloChess · Panov: evaluar actividad y estructura","e4 c6 d4 d5 exd5 cxd5 c4 Nf6 Nc3 e6 Nf3 Bb4 Bd3 O-O O-O Nc6 Re1","Aprende a identificar cuándo una debilidad estructural queda compensada por piezas activas.","Los análisis prácticos del Panov muestran que el peón aislado no decide por sí solo la evaluación. El bando que lo tiene busca actividad, columnas abiertas y presión; el defensor intenta bloquearlo, cambiar piezas y atacar su base. PupiloChess también advierte que una línea teórica exige conocer los recursos tácticos y no jugar por intuición ciega.","No confundas una evaluación ligeramente favorable al blanco con una posición perdida para las negras. La defensa precisa puede neutralizar la iniciativa; tampoco sacrifiques la actividad por recuperar un peón sin necesidad.","PupiloChess · Caro-Kann · Panov · CSsWK8Q__Ak","CSsWK8Q__Ak"],
["PupiloChess · Consejo de maestro: activa tu peor pieza","d4 d5 Nf3 Nf6 Bf4 e6 e3 Bd6 Bg3 O-O Nbd2 c5 c3 Nc6 Bd3","Practica el principio de actividad que PupiloChess repite en sus partidas comentadas.","Antes de buscar una combinación, observa qué pieza está peor colocada y encuentra una ruta para mejorarla. Las piezas coordinadas pueden dominar casillas, crear amenazas y preparar una ruptura. PupiloChess describe la evaluación de la posición como una conversación con las piezas: cuál está incómoda, cuál puede mejorar y qué casilla necesita apoyo.","No hagas una jugada solo porque parezca activa. Comprueba si la pieza tendrá una casilla estable y si al moverla abandonas una defensa importante.","PupiloChess · Consejos · actividad · w0_nkPY-XSY","w0_nkPY-XSY"],
["PupiloChess · Entrenamiento táctico por patrones","e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Nc3","Entrena motivos tácticos repetidos para reconocerlos en una partida real.","PupiloChess explica que la táctica mejora al reconocer patrones que se repiten, no solo al resolver ejercicios al azar una vez. Recomienda trabajar posiciones, intentar calcular la solución y revisar el motivo táctico. La repetición permite reconocer más rápido clavadas, dobles ataques, desviaciones y golpes intermedios.","No mires la solución demasiado pronto ni memorices solo la jugada final. Explica qué amenaza existía, qué pieza estaba sobrecargada y por qué la combinación funciona.","PupiloChess · Consejos · patrones tácticos · 7mmiJRWHFFI","7mmiJRWHFFI"],
["PupiloChess · Crear un hábito de estudio sostenible","e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4","Organiza el entrenamiento alrededor de la constancia y la revisión profunda.","En su vídeo sobre entrenamiento, PupiloChess insiste en que el primer requisito es crear un hábito de estudio. Prefiere estudiar un mismo material varias veces y extraerle provecho antes que acumular muchos libros o ejercicios sin revisarlos. La mejora requiere disciplina, paciencia y revisar los errores propios.","No confundas jugar muchas partidas blitz con estudiar. Reserva tiempo para analizar, repetir posiciones y anotar qué patrón no reconociste.","PupiloChess · Consejos · hábito de estudio · TxWZzO4NNac","TxWZzO4NNac"],
["PupiloChess · Jugar contra un rival superior","e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7","Aprende a competir sin prejuicios cuando tu rival tiene más Elo o un título superior.","PupiloChess recomienda calcular sin asumir que el rival encontrará siempre la refutación. Si tienes ventaja, debes buscar la actividad y atacar cuando la posición lo justifique. Mantén la concentración en el tablero: un rival más fuerte también puede cometer errores y debes estar preparado para detectarlos.","No juegues con miedo al título o al Elo del contrario. Tampoco ataques por orgullo: la decisión debe salir de la evaluación concreta de la posición.","PupiloChess · Consejos · rival superior · TT583W7W7Bw","TT583W7W7Bw"]
);

let mode='play',sf=null,cur=null,score=0,engName='básico',engErr='';
let evalBusy=false,localFlip=false;
const G={g:new Chess(),sel:null,me:'w',lvl:6,test:false,busy:false,over:false,flip:false,pm:null,hint:null};
const T={c:new Chess(),m:[],i:0,branch:false,lesson:0};
/* ---------- Motor: Stockfish con varios candidatos y diagnóstico ---------- */
const CAND=['stockfish-nnue-16-single.js','stockfish.js','stockfish-nnue-16-asm.js'];
const tryEngine=f=>new Promise(res=>{let w;try{w=new Worker('engine/'+f)}catch(e){engErr=f+': '+e.message;return res(null)}
 const t=setTimeout(()=>{engErr=f+': sin respuesta';w.terminate();res(null)},12000);
 w.onerror=e=>{clearTimeout(t);engErr=f+': '+(e.message||'no cargó');w.terminate();res(null)};
 w.onmessage=e=>{if(String(e.data).includes('uciok')){clearTimeout(t);res(w)}};w.postMessage('uci')});
async function initEngine(){for(const f of CAND){const w=await tryEngine(f);if(w){sf=w;engName='Stockfish ('+f+')';w.onerror=()=>{sf=null;engName='básico'};w.onmessage=e=>line(String(e.data));break}}setEng()}
const EP=initEngine();
const setEng=()=>$('#eng').textContent='Motor: '+engName+(sf||!engErr?'':' · '+engErr);
function line(l){const m=l.match(/score (cp|mate) (-?\d+)/);if(m)score=m[1]==='cp'?+m[2]:(+m[2]>0?1000:-1000);
 if(l.startsWith('bestmove')&&cur){const r=cur;cur=null;r({best:l.split(' ')[1],score})}}
/* ---------- Motor de respaldo: alfa-beta real (material + ruido por nivel) ---------- */
function ev(c){let s=0;for(const r of c.board())for(const p of r)if(p)s+=(p.color==='w'?1:-1)*V[p.type];return c.turn()==='w'?s:-s}
const cv=x=>x.captured?V[x.captured]*10-V[x.piece]:0;
function nm(c,d,a,b){if(c.isCheckmate())return -9999-d;if(c.isDraw())return 0;if(!d)return ev(c);
 const m=c.moves({verbose:true}).sort((x,y)=>cv(y)-cv(x));
 for(const x of m){c.move(x);const v=-nm(c,d-1,-b,-a);c.undo();if(v>a){a=v;if(a>=b)break}}return a}
function mini(fen,lvl){const c=new Chess(fen),d=lvl<4?1:lvl<14?2:3,n=lvl<14?(14-lvl)*12:0;let best=null,bv=-1e9;
 for(const x of c.moves({verbose:true})){c.move(x);const v=-nm(c,d-1,-1e9,1e9)+Math.random()*n;c.undo();if(v>bv){bv=v;best=x}}
 return{best:best.from+best.to+(best.promotion||''),score:Math.round(bv)}}
async function ask(fen,go,lvl){await EP;
 if(!sf){await new Promise(r=>setTimeout(r,40));return mini(fen,lvl)}
 return new Promise(res=>{score=0;cur=res;sf.postMessage('setoption name Skill Level value '+lvl);sf.postMessage('position fen '+fen);sf.postMessage('go '+go);
  setTimeout(()=>{if(cur===res){cur=null;res(mini(fen,lvl))}},25000)})}
/* ---------- UI ---------- */
const say=t=>$('#st').textContent=t;
const flipped=()=>(G.me==='b')!==G.flip;
const view=()=>mode==='theory'?{c:T.c,f:false}:{c:G.g,f:mode==='local'?localFlip:flipped()};
function kingSq(c){for(let r=0;r<8;r++)for(let k=0;k<8;k++){const p=c.board()[r][k];if(p&&p.type==='k'&&p.color===c.turn())return 'abcdefgh'[k]+(8-r)}}
function render(){const{c,f}=view(),b=$('#board');b.innerHTML='';const bd=c.board(),h=c.history({verbose:true}),last=h[h.length-1];
 const tg=(mode==='play'||mode==='local')&&G.sel?c.moves({square:G.sel,verbose:true}).map(m=>m.to):[],ks=c.inCheck()?kingSq(c):null;
 for(let i=0;i<64;i++){const r=f?7-(i>>3):i>>3,k=f?7-(i&7):i&7,sq='abcdefgh'[k]+(8-r),p=bd[r][k],d=document.createElement('div');
  d.className='sq '+((r+k)%2?'d':'l')+(mode==='play'&&sq===G.sel?' sel':'')+(last&&(last.from===sq||last.to===sq)?' last':'')+(tg.includes(sq)?' tg'+(p?' hp':''):'')+(sq===ks?' chk':'')+(G.hint&&(G.hint.from===sq||G.hint.to===sq)?' hint':'');
  if(p){const s=document.createElement('span');s.className=p.color;s.textContent=GL[p.type]+'\uFE0E';d.append(s)}
  d.onclick=()=>tap(sq);b.append(d)}
 const sans=c.history(),mt=[];for(let i=0;i<sans.length;i+=2)mt.push((i/2+1)+'. '+sans[i]+(sans[i+1]?' '+sans[i+1]:''));
 let w=0;for(const r of bd)for(const p of r)if(p)w+=(p.color==='w'?1:-1)*V[p.type];
 $('#mv').textContent=(mode==='play'?'Material: '+(w===0?'igualado':(w>0?'blancas':'negras')+' +'+Math.round(Math.abs(w)/100))+'  ·  ':'')+mt.slice(-6).join('  ')}
function turnText(){const c=G.g;return(c.turn()===G.me?'Tu turno':'Piensa el rival')+(c.inCheck()?' · jaque':'')}
function overText(){const c=G.g;if(c.isCheckmate())return c.turn()===G.me?'Jaque mate. Perdiste.':'Jaque mate. ¡Ganaste!';return c.isDraw()?'Tablas.':''}
const vib=()=>{try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}};
function tap(sq){if((mode!=='play'&&mode!=='local')||G.busy||G.over||G.pm||(mode==='play'&&G.g.turn()!==G.me))return;const c=G.g;
 if(G.sel){const ms=c.moves({square:G.sel,verbose:true}).filter(x=>x.to===sq);
  if(ms.length){if(ms[0].promotion){G.pm={from:G.sel,to:sq};return promo()}return move({from:G.sel,to:sq})}}
 const p=c.get(sq),sideToMove=c.turn();G.sel=p&&p.color===(mode==='local'?sideToMove:G.me)?sq:null;render()}
function promo(){const p=$('#pr');p.hidden=false;p.innerHTML='';for(const t of['q','r','b','n']){const b=document.createElement('button');b.textContent=GL[t]+'\uFE0E';b.onclick=()=>{const m={...G.pm,promotion:t};G.pm=null;p.hidden=true;move(m)};p.append(b)}}
async function move(m){
 const before=G.g.fen(),mover=G.g.turn(),san=G.g.move(m).san,afterFen=G.g.fen();
 G.sel=null;G.hint=null;vib();render();
 if(mode==='play'||mode==='local')await diagnoseMove(before,afterFen,mover,san,m.from+m.to+(m.promotion||''));
 await after();
}
async function diagnoseMove(before,afterFen,mover,san,uci){
 if(evalBusy)return;
 evalBusy=true;
 try{
  say('Analizando tu jugada y comparándola con la mejor alternativa…');
  const best=await ask(before,'depth 14',20);
  const playedEval=await ask(afterFen,'depth 14',20);
  const playedPerspective=-playedEval.score;
  let bestPerspective=playedPerspective,bestSan='No disponible',bestMove=null;
  if(best.best&&best.best!=='(none)'){
   const reference=new Chess(before),u=best.best;
   try{
    bestMove=reference.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});
    bestSan=bestMove.san;
    const afterBest=await ask(reference.fen(),'depth 14',20);
    bestPerspective=-afterBest.score;
   }catch(e){}
  }
  const loss=Math.max(0,Math.round(bestPerspective-playedPerspective));
  const played=new Chess(before),actual=played.move({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]});
  const after=new Chess(afterFen),facts=[];
  if(actual.captured)facts.push('Has capturado '+pieceName(actual.captured)+'. Comprueba si la pieza capturada estaba defendida y qué queda desprotegido después del cambio.');
  if(actual.san.includes('+'))facts.push('Has dado jaque. Un jaque obliga al rival a responder, pero no siempre es bueno: revisa si ganas algo o solo ayudas a desarrollar sus piezas.');
  if(actual.san.includes('#'))facts.push('¡Jaque mate! El rey rival no tiene ninguna respuesta legal.');
  if(actual.flags.includes('k')||actual.flags.includes('q'))facts.push('Has enrocado: apartas al rey del centro y conectas las torres.');
  if(['e4','d4','e5','d5'].includes(actual.to))facts.push('Esta jugada influye directamente en el centro, que da espacio y casillas de entrada a tus piezas.');
  if(actual.piece==='n'||actual.piece==='b')facts.push('Al desarrollar una pieza menor, intenta que ataque o controle casillas centrales y que no tenga que moverse varias veces.');
  if(actual.piece==='q'&&played.history().length<12)facts.push('Sacar la dama temprano puede exponerla a ataques que hacen perder tiempos. Hazlo solo si existe una razón concreta.');
  if(actual.piece==='p'&&!actual.captured&&!['e4','d4','e5','d5'].includes(actual.to))facts.push('Cada avance de peón deja casillas detrás que ya no podrán ser defendidas por otro peón. Pregúntate qué casillas debilitas.');
  if(after.isCheck())facts.push('Tu rey está en jaque: la prioridad es salir del jaque, no continuar con un plan.');
  const label=loss<=10?'EXCELENTE':loss<=30?'BUENA':loss<=70?'IMPRECISA':loss<=130?'MALA':loss<=250?'MUY MALA':'ERROR GRAVE';
  const color=loss<=30?'#9bd6a5':loss<=70?'#f2d27a':'#ff9999';
  const how='Para detectarlo tú mismo, antes de mover aplica este orden: 1) ¿Qué jaques tiene el rival? 2) ¿Qué piezas puede capturar? 3) ¿Qué amenaza? 4) ¿Mi pieza quedará defendida? 5) ¿Mi jugada desarrolla, mejora una pieza o crea una amenaza real?';
  const why=loss<=30?'La evaluación apenas empeora frente a la mejor opción calculada. Aun así, revisa las amenazas del rival en la siguiente jugada.':loss<=70?'La idea puede ser razonable, pero había una continuación más precisa. Compara qué pieza mejora cada opción y qué amenazas permite.':'La alternativa del motor conserva bastante mejor la posición. Busca qué amenaza concreta no atendiste: una pieza atacada, un jaque, una captura o una casilla débil.';
  const box=document.createElement('div');box.id='move-review';box.style.cssText='padding:12px;margin:8px 0;border:1px solid #71858a;border-radius:10px;background:#22343c;line-height:1.5';
  const title=document.createElement('h3');title.style.cssText='margin:0 0 8px;color:'+color;title.textContent='Tu jugada: '+label+' · '+san+' · pérdida estimada '+loss+' cp';box.append(title);
  const p=document.createElement('p');p.textContent=why;box.append(p);
  const alt=document.createElement('p');alt.innerHTML='<b>Mejor opción:</b> ';alt.append(document.createTextNode(bestSan+(bestMove?' ('+bestMove.from+' → '+bestMove.to+')':'')+'. '));box.append(alt);
  const explain=document.createElement('p');explain.innerHTML='<b>¿Por qué era mejor?</b> ';explain.append(document.createTextNode(bestMove?'El motor la prefiere porque, tras calcular las respuestas, deja una evaluación aproximadamente '+Math.max(0,Math.round(bestPerspective-playedPerspective))+' centipeones mejor que tu jugada. Mira qué pieza activa, qué amenaza crea o qué peligro evita.':'No se pudo obtener una variante alternativa fiable en este análisis.'));box.append(explain);
  const detail=document.createElement('p');detail.innerHTML='<b>Qué ocurre con tu jugada:</b> ';detail.append(document.createTextNode(facts.join(' ')||'No aparece un motivo táctico elemental evidente. Compara la seguridad de las piezas y el plan de ambos bandos.'));box.append(detail);
  const tip=document.createElement('p');tip.innerHTML='<b>Cómo aprender a reconocerlo:</b> ';tip.append(document.createTextNode(how));box.append(tip);
  const caveat=document.createElement('small');caveat.textContent='La valoración es una estimación del motor a profundidad limitada, no una verdad absoluta. En posiciones complejas puede cambiar al calcular más.';box.append(caveat);
  const old=$('#move-review');if(old)old.remove();$('#mv').after(box);
 }catch(e){say('Jugada realizada. No se pudo completar el análisis: '+e.message)}
 finally{evalBusy=false;if(!G.over)say(mode==='local'?(G.g.turn()==='w'?'Turno de blancas':'Turno de negras')+'. Pasa el teléfono.':turnText())}
}
function pieceName(p){return ({p:'peón',n:'caballo',b:'alfil',r:'torre',q:'dama',k:'rey'})[p]||'pieza'}
async function after(){const o=overText();if(o)return finish(o);if(mode==='local'){say((G.g.turn()==='w'?'Turno de blancas':'Turno de negras')+'. Pasa el teléfono.');return}say(turnText());if(G.g.turn()!==G.me)await engineTurn()}
async function engineTurn(){G.busy=true;say('Piensa el rival…');const r=await ask(G.g.fen(),'movetime '+(200+G.lvl*45),G.lvl),b=r.best;setEng();
 G.g.move({from:b.slice(0,2),to:b.slice(2,4),promotion:b[4]});G.busy=false;vib();render();const o=overText();o?finish(o):say(turnText())}
function finish(t){G.over=true;say(t);if(G.test)analyze()}
async function analyze(){if(!sf)return say('El test necesita Stockfish. '+('Motor: '+engName+(engErr?' · '+engErr:'')));
 const h=G.g.history({verbose:true}),n=h.filter(m=>m.color==='w').length;if(n<12)return say('Muestra insuficiente: juega al menos 12 jugadas con blancas y repite el test.');
 G.busy=true;const c=new Chess();let tot=0,k=0;
 for(const m of h){if(m.color==='w'){say('Analizando tus jugadas '+(k+1)+'/'+n+'…');const s1=(await ask(c.fen(),'depth 8',20)).score;c.move(m.san);
  const s2=c.isCheckmate()?1000:c.isDraw()?0:-(await ask(c.fen(),'depth 8',20)).score;tot+=Math.min(500,Math.max(0,s1-s2));k++}else c.move(m.san)}
 G.busy=false;const acpl=tot/k;const band=acpl<20?'1900–2200':acpl<35?'1700–2000':acpl<50?'1500–1800':acpl<70?'1300–1600':acpl<95?'1000–1400':acpl<130?'800–1200':'menor de 1100';
 const games=JSON.parse(localStorage.eloGames||'[]');games.push({date:Date.now(),acpl:Math.round(acpl),moves:k});localStorage.eloGames=JSON.stringify(games.slice(-10));
 const avg=games.slice(-5).reduce((a,x)=>a+x.acpl,0)/Math.min(5,games.length);const stable=games.length>=5;const ref=stable?avg:acpl;
 const band5=ref<20?'1900–2200':ref<35?'1700–2000':ref<50?'1500–1800':ref<70?'1300–1600':ref<95?'1000–1400':ref<130?'800–1200':'menor de 1100';
 localStorage.elo=stable?band5:(band5+' (provisional)');const lv=Math.min(20,Math.max(0,Math.round((1700-avg)/45)+8));$('#lv').value=lv;lvl();
 say('Pérdida media: '+Math.round(acpl)+' cp por jugada. Banda orientativa: '+band+' Elo. '+(stable?'Basada en las últimas 5 pruebas.':'Aún provisional: hacen falta 5 pruebas para suavizar la variación.')+' No es Elo FIDE ni rating oficial.');eloTxt()}
const lvl=()=>{const v=+$('#lv').value;localStorage.lvl=v;$('#lvt').textContent='Rival nivel '+v+' · ≈ Elo '+(1100+v*95)};
const eloTxt=()=>$('#elo').textContent=localStorage.elo?'Rendimiento orientativo: '+localStorage.elo+'. No equivale a Elo FIDE; se calibra mejor con varias pruebas.':'Aún no has hecho el test de nivel.';
function start(test){mode='play';tabs();G.g=new Chess();G.sel=null;G.over=false;G.busy=false;G.pm=null;G.hint=null;$('#pr').hidden=true;G.test=test;G.me=test?'w':$('#col').value;G.lvl=test?6:+$('#lv').value;
 $('#un').disabled=test;$('#hn').disabled=test;render();say(test?'Test de nivel: juega tu mejor partida, sin deshacer. Al terminar, se mide tu Elo.':turnText());if(G.me==='b')engineTurn()}
function tabs(){$('#play').hidden=mode!=='play';$('#local').hidden=mode!=='local';$('#theory').hidden=mode!=='theory';$('#t1').className=mode==='play'?'on':'';$('#t3').className=mode==='local'?'on':'';$('#t2').className=mode==='theory'?'on':'';
 if(mode==='theory'){say('Teoría: avanza jugada por jugada.')}render()}
function progressText(){const done=JSON.parse(localStorage.chessLessonsDone||'[]');$('#courseProgress').textContent='Progreso del curso: '+done.length+' / '+L.length+' clases completadas'+(done.includes(T.lesson)?' · Esta clase está completada.':'');$('#markDone').textContent=done.includes(T.lesson)?'Clase completada ✓':'Marcar clase como completada'}
function showLesson(){const l=L[T.lesson];progressText();const source=l[6]?'<p><b>Vídeo fuente de PupiloChess:</b> '+l[6]+'</p>':'';$('#lesson').innerHTML='<div class="tag">'+l[5]+'</div><h3>'+l[0]+'</h3><p><b>Qué vas a aprender:</b> '+l[2]+'</p><p><b>Idea estratégica:</b> '+l[3]+'</p><p><b>Error típico:</b> '+l[4]+'</p>'+source+'<p><b>Regla para principiantes:</b> no memorices solo el orden. Entiende qué amenaza cada jugada, qué pieza mejora y qué respuesta del rival debes esperar.</p>';renderLessonStep();$('#plan').textContent='Curso guiado: avanza una jugada cada vez, lee su explicación y luego prueba una alternativa legal. El motor responderá para que compares los planes.'}
function renderLessonStep(){
 const box=$('#lessonStep');if(!box)return;
 const l=L[T.lesson],n=T.i;
 if(!n){box.innerHTML='<div class="tag">Antes de empezar</div><h3>Cómo estudiar esta posición</h3><p>Primero identifica el centro (las casillas e4, d4, e5 y d5), después cuenta qué piezas están desarrolladas y comprueba si los dos reyes están seguros.</p><p><b>Pregunta guía:</b> si tu rival pudiera mover dos veces seguidas, ¿qué amenazaría? Esta pregunta te enseña a detectar peligros antes de ejecutar tu plan.</p>';return}
 const c=new Chess();let last=null;try{T.m.slice(0,n).forEach(s=>{last=c.move(s)})}catch(e){box.textContent='No se pudo explicar esta posición porque la línea contiene una jugada inválida.';return}
 const mover=last.color==='w'?'Blancas':'Negras',piece=pieceName(last.piece),target=last.to,kind=last.piece==='p'?'avance de peón':last.piece==='n'||last.piece==='b'?'desarrollo de pieza menor':last.piece==='q'?'movimiento de dama':last.piece==='r'?'actividad de torre':'movimiento del rey';
 let idea='Observa qué casillas controla ahora la pieza y si queda protegida. Una jugada útil suele mejorar tu posición y limitar las opciones del rival.';
 if(last.piece==='p')idea='Los peones construyen el centro y ganan espacio, pero no pueden retroceder. Antes de avanzar, comprueba qué casillas dejas débiles y si el rival puede atacar la base de tu cadena de peones.';
 if(last.piece==='n')idea='Los caballos funcionan mejor cerca del centro, donde suelen controlar más casillas. Busca una casilla estable desde la que no puedan expulsarlos fácilmente con peones.';
 if(last.piece==='b')idea='Los alfiles necesitan diagonales abiertas. Pregúntate si tus propios peones bloquean su recorrido y qué piezas o casillas importantes está mirando.';
 if(last.piece==='q')idea='La dama es poderosa, pero también puede ser perseguida por piezas menores. Si sale pronto, calcula si el rival gana tiempos atacándola mientras desarrolla.';
 if(last.piece==='r')idea='Las torres suelen ser más fuertes en columnas abiertas o semiabiertas. Intenta conectarlas y colocarlas detrás de peones pasados o en columnas donde puedan entrar.';
 if(last.flags.includes('k')||last.flags.includes('q'))idea='El enroque es una jugada de seguridad: el rey se aleja del centro y una torre se acerca al juego. No lo hagas si la casilla de paso o de llegada está atacada.';
 if(last.captured)idea+=' Además, has capturado una pieza: después de cualquier captura, comprueba si tu pieza queda recapturable y calcula el intercambio completo, no solo la primera captura.';
 if(last.san.includes('+'))idea+=' Es jaque: el rival está obligado a responder. Antes de dar jaque, valora si ganas tiempo o material, o si simplemente ayudas al rey a escapar.';
 box.innerHTML='<div class="tag">Explicación jugada '+n+' de '+T.m.length+'</div><h3>'+mover+' · '+last.san+'</h3><p><b>Qué has hecho:</b> '+piece+' ('+kind+') llega a <b>'+target+'</b>.</p><p><b>Por qué puede ser útil:</b> '+idea+'</p><p><b>Qué debes mirar ahora:</b> revisa las amenazas del rival, las piezas sin defensa y las casillas centrales. No des por buena una jugada solo porque ataque algo: calcula la respuesta del contrario.</p><p><b>Mini-reto:</b> señala una pieza rival que ahora esté atacada y comprueba si está defendida. Si no hay ninguna, identifica qué pieza tuya mejoró con esta jugada.</p>';
}
function fillAlternatives(){const sel=$('#alt');sel.innerHTML='<option value="">Elige una jugada alternativa…</option>';if(T.branch)return;for(const m of T.c.moves({verbose:true}))sel.add(new Option(m.san+' · '+m.from+' → '+m.to,m.from+' '+m.to+(m.promotion?' '+m.promotion:'')))}
function line_(){T.lesson=+$('#ln').value;T.m=L[T.lesson][1].split(/\s+/).map(m=>m.replace(/^\d+\./,'')).filter(Boolean);T.i=0;T.branch=false;showLesson();step(0,0)}
function step(d,abs){if(T.branch){say('Estás explorando una variante. Pulsa «Volver a la línea del curso» para continuar.');return}T.i=abs!==undefined?abs:Math.max(0,Math.min(T.m.length,T.i+d));T.c=new Chess();try{T.m.slice(0,T.i).forEach(m=>T.c.move(m))}catch(e){say('Línea inválida: '+e.message)}$('#pn').textContent='Jugada '+T.i+' de '+T.m.length;fillAlternatives();renderLessonStep();render()}
async function explore(){if(T.branch)return;const v=$('#alt').value;if(!v)return say('Primero elige una jugada alternativa.');const [from,to,promotion]=v.split(' ');const m=T.c.moves({square:from,verbose:true}).find(x=>x.to===to&&(!promotion||x.promotion===promotion));if(!m)return say('Esa jugada ya no es legal.');T.c.move({from,to,promotion});T.branch=true;render();renderLessonStep();say('Has probado '+m.san+'. Compara esta alternativa con la línea principal: el motor calcula la respuesta más fuerte…');try{const r=await ask(T.c.fen(),'depth 12',20);if(r.best&&r.best!=='(none)'){const x=r.best;const reply=T.c.moves({square:x.slice(0,2),verbose:true}).find(y=>y.to===x.slice(2,4));if(reply){T.c.move({from:reply.from,to:reply.to,promotion:reply.promotion});render();say('Respuesta del motor: '+reply.san+'. Observa qué amenaza crea y cómo cambia la posición.');return}}say('No se encontró una respuesta legal en esta posición.')}catch(e){say('No se pudo calcular la respuesta del motor.')}}
function resetLine(){T.branch=false;line_();say('Volviste a la línea principal de la clase.')}
L.forEach((l,i)=>$('#ln').add(new Option(l[0],i)));
$('#ln').onchange=line_;$('#p0').onclick=()=>step(0,0);$('#p1').onclick=()=>step(-1);$('#p2').onclick=()=>step(1);$('#altplay').onclick=explore;$('#backline').onclick=resetLine;$('#markDone').onclick=()=>{const done=JSON.parse(localStorage.chessLessonsDone||'[]');if(!done.includes(T.lesson))done.push(T.lesson);localStorage.chessLessonsDone=JSON.stringify(done);progressText();say('Clase guardada como completada en este teléfono.')};
$('#t1').onclick=()=>{mode='play';tabs();say(G.over?'':turnText())};$('#t3').onclick=()=>{mode='local';G.g=new Chess();G.sel=null;G.over=false;G.busy=false;G.pm=null;localFlip=false;tabs();render();say('Turno de blancas. Pasa el teléfono después de cada jugada.')};$('#t2').onclick=()=>{mode='theory';tabs();line_()};
$('#lnw').onclick=()=>{G.g=new Chess();G.sel=null;G.over=false;G.pm=null;localFlip=false;const old=$('#move-review');if(old)old.remove();render();say('Nueva partida local. Turno de blancas.')};$('#lfl').onclick=()=>{localFlip=!localFlip;render()};
$('#nw').onclick=()=>start(false);$('#ts').onclick=()=>start(true);$('#lv').oninput=lvl;$('#col').onchange=()=>{G.flip=false};
$('#fl').onclick=()=>{G.flip=!G.flip;render()};
$('#hn').onclick=async()=>{if(G.busy||G.over||G.test||G.g.turn()!==G.me)return;G.busy=true;say('Buscando una pista…');const r=await ask(G.g.fen(),'movetime 800',20);G.busy=false;
 G.hint={from:r.best.slice(0,2),to:r.best.slice(2,4)};render();say('Pista: '+G.hint.from+' → '+G.hint.to)};
$('#un').onclick=()=>{if(G.busy||G.test)return;G.g.undo();if(G.g.turn()!==G.me)G.g.undo();G.over=false;G.sel=null;G.hint=null;render();say(turnText())};
$('#rs').onclick=()=>{if(mode==='play'&&!G.over&&!G.busy){G.over=true;say('Te rendiste.');if(G.test)analyze()}};
$('#lv').value=localStorage.lvl||8;lvl();eloTxt();setEng();start(false);EP.then(()=>{if(!localStorage.elo&&!G.busy&&G.g.history().length===0)say('Pulsa «Test de nivel» para medir tu Elo y empezar desde ahí. O juega una partida libre.')});
</script></body></html>
