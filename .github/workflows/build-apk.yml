name: Build APK
concurrency:
  group: maestro-ajedrez-apk
  cancel-in-progress: false
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: maestro-ajedrez-debug-signing-v1
      - name: Ensure persistent Android debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run prepare-www
      - name: Validate PupiloChess lesson lines
        run: npm run test:lessons
      - name: Include offline Stockfish WASM
        run: node scripts/get-stockfish.js
        env:
          STOCKFISH_REQUIRED: '1'
      - name: Verify engine assets
        run: |
          ls -lah www/engine
          node -e "const fs=require('fs');const p=require('./www/engine/engine.json');if(!p.js||!p.wasm?.length)process.exit(1);for(const f of [p.js,...p.wasm]){const b=fs.readFileSync('www/engine/'+f);if(f.endsWith('.wasm')&&(b.length<100000||b.readUInt32LE(0)!==0x6d736100))throw new Error('WASM inválido: '+f)};console.log(p)"
      - name: Test Maestro engine
        run: npm run test:engine
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply custom Android launcher icon
        run: node scripts/apply-android-branding.js
      - name: Set increasing Android version code
        run: |
          node -e "const fs=require('fs');const p='android/app/build.gradle';let s=fs.readFileSync(p,'utf8');const n=Number(process.env.GITHUB_RUN_NUMBER)||1;s=s.replace(/versionCode\\s+\\d+/, 'versionCode '+n);s=s.replace(/versionName\\s+['\"][^'\"]+['\"]/, 'versionName \\\"2.1.'+n+'\\\"');fs.writeFileSync(p,s);console.log('Android versionCode:',n)"
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify Stockfish is inside APK
        run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/public/engine/.*\.wasm'
      - uses: actions/upload-artifact@v5
        with:
          name: maestro-ajedrez-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
