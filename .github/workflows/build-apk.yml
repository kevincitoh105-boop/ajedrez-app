name: Build APK
concurrency:
  group: maestro-ajedrez-apk
  cancel-in-progress: false
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: maestro-ajedrez-debug-signing-v1
      - name: Verify persistent Android signing key
        run: |
          test -f "$HOME/.android/debug.keystore" || { echo "::error::Persistent signing key is missing. Refusing to generate a new key because that would break APK updates."; exit 1; }
          FINGERPRINT="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p')"
          EXPECTED="8E:29:1C:37:D3:CF:4B:6B:58:73:0C:C6:BC:F2:B2:DB:80:95:17:2A:5F:53:F7:1F:2F:01:7C:37:EE:00:D7:96"
          test "$FINGERPRINT" = "$EXPECTED" || { echo "::error::Android signing certificate changed. Refusing to publish an incompatible APK."; exit 1; }
          echo "Persistent Android signing certificate verified: $FINGERPRINT"
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run prepare-www
      - name: Validate course lessons, endgame positions and legal lines
        run: npm run test:lessons
      - name: Test UI regressions
        run: npm run test:ui
      - name: Include offline Stockfish WASM
        run: node scripts/get-stockfish.js
        env:
          STOCKFISH_REQUIRED: '1'
      - name: Verify engine assets
        run: |
          ls -lah www/engine
          node -e "const fs=require('fs');const p=require('./www/engine/engine.json');if(!p.js||!p.wasm?.length)process.exit(1);for(const f of [p.js,...p.wasm]){const b=fs.readFileSync('www/engine/'+f);if(f.endsWith('.wasm')&&(b.length<100000||b.readUInt32LE(0)!==0x6d736100))throw new Error('WASM inválido: '+f)};console.log(p)"
      - name: Test Maestro engine
        run: npm run test:engine
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Install image processor for Android launcher icons
        run: npm install --no-save sharp
      - name: Apply custom Android launcher icon
        run: node scripts/apply-android-branding.js
      - name: Set increasing Android version code
        run: |
          node -e "const fs=require('fs');const p='android/app/build.gradle';let s=fs.readFileSync(p,'utf8');const n=Number(process.env.GITHUB_RUN_NUMBER)||1;s=s.replace(/versionCode\\s+\\d+/, 'versionCode '+n);s=s.replace(/versionName\\s+['\"][^'\"]+['\"]/, 'versionName \\\"2.1.'+n+'\\\"');fs.writeFileSync(p,s);console.log('Android versionCode:',n)"
      - name: Bind debug build to persistent Android signing key
        run: |
          test -f "$HOME/.android/debug.keystore"
          cat >> android/app/build.gradle <<'GRADLE'

          // CI persistent Android debug signing
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify APK uses persistent Android signing key
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk)"
          echo "$CERT_OUTPUT"
          ACTUAL="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="8E291C37D3CF4B6B58730CC6BCF2B2DB8095172A5F53F71F2F017C37EE00D796"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::APK signer does not match the persistent Android key. Actual: $ACTUAL"; exit 1; }
      - name: Verify custom launcher icon in APK
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-badging.txt
          grep -F "package: name='com.ajedrez.maestro'" /tmp/apk-badging.txt
          grep -E "^application:.*icon='res/.*ic_launcher" /tmp/apk-badging.txt
          "$AAPT" dump resources android/app/build/outputs/apk/debug/app-debug.apk | grep -E "ic_launcher(_round|_foreground)?"
          cp android/app/build/outputs/apk/debug/app-debug.apk Chess-Master.apk
      - name: Verify Stockfish is inside APK
        run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/public/engine/.*\.wasm'
      - uses: actions/upload-artifact@v5
        with:
          name: Chess-Master
          path: Chess-Master.apk
